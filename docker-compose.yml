services:
  backend:
    build:
      context: .
      dockerfile: ./Stockify-Backend/Dockerfile
    container_name: stockify-backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - PYTHON_SERVER_URL=http://news-analysis:5001/api/news
      - UPSTOX_WS_URL=ws://upstox-backend:4141
      - FEED_API_URL=http://upstox-backend:4141
      - AEGIS_PYTHON_URL=http://aegis:5050
      - AUTOTRADING_URL=http://autotrading:8000
      - AUTOTRADING_WS_URL=ws://autotrading:8000
      - KAFKA_BROKERS=kafka:29092
      - NODE_ENV=production
    depends_on:
      - upstox-backend
      - kafka
      - kafka-init

  news-analysis:
    build:
      context: ./NewsAnalysis
    container_name: news-analysis
    ports:
      - "5001:5001"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - BACKEND_URL=http://backend:4000

  intraday-squareoff:
    build:
      context: .
      dockerfile: ./AlgoTrading/Dockerfile
    container_name: intraday-squareoff
    ports:
      - "4001:4001"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - kafka-init

  stoploss-engine:
    build:
      context: .
      dockerfile: ./AlgoTrading/stoploss-engine/Dockerfile
    container_name: stoploss-engine
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - FEED_API_URL=http://upstox-backend:4141
      - UPSTOX_WS_URL=ws://upstox-backend:4141
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - upstox-backend
      - kafka
      - kafka-init


  pressrelease-cron:
    build:
      context: ./MultiAgent/PressRelease
    container_name: pressrelease-cron
    restart: unless-stopped
    env_file:
      - ./MultiAgent/PressRelease/.env

  upstox-backend:
    build:
      context: ./Upstox-Backend
    container_name: upstox-backend
    ports:
      - "4141:4141"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
      - ./Upstox-Backend/.env

  notification-worker:
    build:
      context: .
      dockerfile: ./Notification_Service/Dockerfile
    container_name: paperbull-notification-worker
    restart: unless-stopped
    env_file:
      - ./Notification_Service/.env
    environment:
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
      - kafka-init
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: paperbull-mcp-server
    ports:
      - "4142:4142"
    restart: unless-stopped
    env_file:
      - ./mcp/.env
    environment:
      - STOCKIFY_BASE_URL=http://backend:4000
      - MCP_HOST=0.0.0.0
      - MCP_PORT=4142
      - MCP_TRANSPORT=sse
    depends_on:
      - backend

  aegis:
    build:
      context: ./Aegis
    container_name: stockify-aegis
    ports:
      - "5050:5050"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
      - ./Aegis/.env
    environment:
      - STOCKIFY_API_URL=http://backend:4000
      - NEWS_ANALYSIS_URL=http://news-analysis:5001
      - ALGO_TRADING_URL=http://autotrading:8000
    depends_on:
      - backend
      - news-analysis

  autotrading:
    build:
      context: ./AutoTrading
    container_name: stockify-autotrading
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
      - ./AutoTrading/.env
    environment:
      - FEED_API_URL=http://upstox-backend:4141
      - UPSTOX_WS_URL=ws://upstox-backend:4141
      - STOCKIFY_API_URL=http://backend:4000
      - NODE_ENV=production
    depends_on:
      - upstox-backend

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: stockify-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped

  kafka-init:
    build:
      context: ./Kafka-communication
      dockerfile: Dockerfile
    container_name: stockify-kafka-init
    environment:
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: stockify-kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: stockify-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

  order-execution:
    build:
      context: .
      dockerfile: ./OrderExecution/Dockerfile
    container_name: stockify-order-execution
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - KAFKA_BROKERS=kafka:29092
      - FEED_API_URL=http://upstox-backend:4141
      - NODE_ENV=production
    depends_on:
      - kafka
      - kafka-init
      - upstox-backend

  frontend:
    build:
      context: ./Stockify-Frontend
      dockerfile: Dockerfile
    container_name: stockify-frontend
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend


