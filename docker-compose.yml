services:
  backend:
    build:
      context: ./Stockify-Backend
    container_name: stockify-backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - PYTHON_SERVER_URL=http://news-analysis:5001/api/news
      - UPSTOX_WS_URL=ws://upstox-backend:4141
      - AEGIS_PYTHON_URL=http://aegis:5050
      - NODE_ENV=production

  news-analysis:
    build:
      context: ./NewsAnalysis
    container_name: news-analysis
    ports:
      - "5001:5001"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - BACKEND_URL=http://backend:4000

  intraday-squareoff:
    build:
      context: ./AlgoTrading
    container_name: intraday-squareoff
    ports:
      - "4001:4001"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env

  stoploss-engine:
    build:
      context: ./AlgoTrading
      dockerfile: stoploss-engine/Dockerfile
    container_name: stoploss-engine
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - UPSTOX_WS_URL=ws://upstox-backend:4141


  pressrelease-cron:
    build:
      context: ./MultiAgent/PressRelease
    container_name: pressrelease-cron
    restart: unless-stopped
    env_file:
      - ./MultiAgent/PressRelease/.env

  upstox-backend:
    build:
      context: ./Upstox-Backend
    container_name: upstox-backend
    ports:
      - "4141:4141"
    restart: unless-stopped
    env_file:
      - ./Upstox-Backend/.env

  notification-worker:
    build:
      context: ./Notification_Service
      dockerfile: Dockerfile
    container_name: paperbull-notification-worker
    restart: unless-stopped
    env_file:
      - ./Notification_Service/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 30s

  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: paperbull-mcp-server
    ports:
      - "4142:4142"
    restart: unless-stopped
    env_file:
      - ./mcp/.env
    environment:
      - STOCKIFY_BASE_URL=http://backend:4000
      - MCP_HOST=0.0.0.0
      - MCP_PORT=4142
      - MCP_TRANSPORT=sse
    depends_on:
      - backend

  aegis:
    build:
      context: ./Aegis
    container_name: stockify-aegis
    ports:
      - "5050:5050"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
      - ./Aegis/.env
    environment:
      - STOCKIFY_API_URL=http://backend:4000
      - NEWS_ANALYSIS_URL=http://news-analysis:5001
      - ALGO_TRADING_URL=http://autotrading:8000
    depends_on:
      - backend
      - news-analysis

  autotrading:
    build:
      context: ./AutoTrading
    container_name: stockify-autotrading
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ./Stockify-Backend/.env
    environment:
      - UPSTOX_WS_URL=ws://upstox-backend:4141
      - NODE_ENV=production
    depends_on:
      - upstox-backend

