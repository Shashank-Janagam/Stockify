name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            echo "Connected to Azure VM"
            git config --global --add safe.directory "*" 2>/dev/null || true

            REPO_DIR="$HOME/Stockify"
            REPO_URL="https://github.com/Shashank-Janagam/Stockify.git"
            BACKUP_DIR="$HOME/.stockify_env_backup"

            # ── Backup .env files before any git operation ──────────────────
            echo "Backing up .env files..."
            rm -rf "$BACKUP_DIR" && mkdir -p "$BACKUP_DIR"
            for f in \
              "$REPO_DIR/Stockify-Backend/.env" \
              "$REPO_DIR/Upstox-Backend/.env" \
              "$REPO_DIR/AlgoTrading/.env" \
              "$REPO_DIR/Notification_Service/.env" \
              "$REPO_DIR/mcp/.env" \
              "$REPO_DIR/Aegis/.env" \
              "$REPO_DIR/MultiAgent/PressRelease/.env"; do
              if [ -f "$f" ]; then
                REL=$(echo "$f" | sed "s|$REPO_DIR/||")
                mkdir -p "$BACKUP_DIR/$(dirname "$REL")"
                cp "$f" "$BACKUP_DIR/$REL"
                echo "  Backed up: $REL"
              fi
            done

            # ── Ensure the repo is a valid git repo; re-clone if needed ─────
            # NOTE: check git validity, not just .git existence (can be corrupt)
            if git -C "$REPO_DIR" rev-parse --git-dir > /dev/null 2>&1; then
              echo "Valid git repo at $REPO_DIR"
              cd "$REPO_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch origin main
              git reset --hard origin/main
            else
              echo "$REPO_DIR is not a valid git repo — deleting and cloning fresh..."
              rm -rf "$REPO_DIR"
              git clone "$REPO_URL" "$REPO_DIR"
              cd "$REPO_DIR"
            fi

            # ── Restore .env files (overwrite any blanks left by git reset) ──
            echo "Restoring .env files..."
            for f in $(find "$BACKUP_DIR" -name ".env" -type f 2>/dev/null); do
              REL=$(echo "$f" | sed "s|$BACKUP_DIR/||")
              DEST="$REPO_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$f" "$DEST"
              echo "  Restored: $REL"
            done

            # ── Ensure required env files exist (even if never had a value) ──
            echo "Ensuring required env files exist..."
            for dir in AlgoTrading AutoTrading MultiAgent/PressRelease Upstox-Backend Notification_Service mcp Aegis; do
              mkdir -p "./$dir"
              touch "./$dir/.env"
            done

            # ── Build and start Docker services ─────────────────────────────
            echo "Rebuilding and starting services..."
            docker compose up --build -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment completed."