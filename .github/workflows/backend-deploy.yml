name: Deploy Backend to Azure VM

on:
  push:
    branches:
      - main
jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            set -e
            echo "Connected to Azure VM"
            git config --global --add safe.directory "*" 2>/dev/null || true

            # Locate or restore the git repository
            if [ -d "$HOME/Stockify/.git" ]; then
              cd "$HOME/Stockify"
            elif [ -d "$HOME/stockify/.git" ]; then
              cd "$HOME/stockify"
            elif [ -d "$HOME/Stockify/Stockify/.git" ]; then
              cd "$HOME/Stockify/Stockify"
            else
              echo "No .git found in default paths. Searching home directory..."
              FOUND_GIT=$(find "$HOME" -maxdepth 3 -name ".git" -type d 2>/dev/null | head -n 1)
              if [ -n "$FOUND_GIT" ]; then
                REPO_DIR=$(dirname "$FOUND_GIT")
                echo "Found git repository at: $REPO_DIR"
                cd "$REPO_DIR"
              else
                echo "No git repo found on VM. Cloning fresh into $HOME/Stockify..."
                # Preserve any existing files/env in Stockify if present
                if [ -d "$HOME/Stockify" ]; then
                  cd "$HOME/Stockify"
                  git init
                  git remote add origin https://github.com/Shashank-Janagam/Stockify.git 2>/dev/null || git remote set-url origin https://github.com/Shashank-Janagam/Stockify.git
                else
                  git clone https://github.com/Shashank-Janagam/Stockify.git "$HOME/Stockify"
                  cd "$HOME/Stockify"
                fi
              fi
            fi

            echo "Working in: $(pwd)"

            echo "Fetching and forcefully pulling latest code..."
            git remote set-url origin https://github.com/Shashank-Janagam/Stockify.git 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            echo "Ensuring required env files exist..."
            mkdir -p ./AlgoTrading ./MultiAgent/PressRelease ./Upstox-Backend ./Notification_Service ./mcp
            touch ./AlgoTrading/.env
            touch ./MultiAgent/PressRelease/.env
            touch ./Upstox-Backend/.env
            touch ./Notification_Service/.env
            touch ./mcp/.env

            echo "Rebuilding and starting services..."
            docker compose up --build -d

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment completed."