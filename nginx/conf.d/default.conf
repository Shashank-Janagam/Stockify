upstream backend {
    server 127.0.0.1:4000;
}

upstream news-analysis {
    server 127.0.0.1:5001;
}

upstream mcp-server {
    server 127.0.0.1:4142;
}

# ─── 1. Main API Server Block ─────────────────────────────────────────────────
server {
    listen 80;
    server_name localhost stockifyindia.app api.stockifyindia.app;

    # Max upload size
    client_max_body_size 20M;

    # Let's Encrypt Certbot validation challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Python API Proxy
    location /pyapi/ {
        rewrite ^/pyapi/(.*)$ /$1 break;
        proxy_pass http://news-analysis;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node Backend Proxy (including WebSockets)
    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all
    location / {
        return 200 'Stockify Nginx Proxy Running';
        add_header Content-Type text/plain;
    }
}

# ─── 2. MCP Server Subdomain (mcp.stockifyindia.app) ──────────────────────────
server {
    listen 80;
    server_name mcp.stockifyindia.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mcp.stockifyindia.app;

    ssl_certificate /etc/letsencrypt/live/mcp.stockifyindia.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.stockifyindia.app/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:4142;
        proxy_http_version 1.1;

        # SSE Streaming headers
        proxy_set_header Connection '';

        # Pass internal host so FastMCP DNS-rebinding protection accepts it.
        # X-Forwarded-Host preserves the real domain for OAuth URL generation.
        proxy_set_header Host "localhost";
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }
}


